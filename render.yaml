# Render blueprint: docker web service + a disk for the story archive.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-storyteller
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: MODEL_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: AI_STORYTELLER_DATA_DIR
        value: /var/data
    disk:
      name: storyteller-archive
      mountPath: /var/data
      sizeGB: 1
