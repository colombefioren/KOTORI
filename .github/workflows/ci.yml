name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # the tests never call the network, but imports read the environment
      MODEL_NAME: test-model
      API_KEY: test-key
      BASE_URL: https://example.test/v1
    steps:
      - uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync the environment
        run: uv sync --frozen

      - name: lint
        run: uv run ruff check src tests

      - name: format check
        run: uv run ruff format --check src tests

      - name: test
        run: |
          uv run pytest -q \
            --cov=ai_storyteller \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build the image
        run: docker build -t ai-storyteller:ci .
