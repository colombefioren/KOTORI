<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     role="img" aria-labelledby="title desc">
  <title id="title">AI Storyteller — a pastel scratchbook studio</title>
  <desc id="desc">A warm paper page holding a composer card, a story being read aloud with the
  spoken word highlighted, a rounded player with a pastel play button, and a shelf of saved
  stories. Drawn to match the live stylesheet.</desc>

  <defs>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6cbf4" />
      <stop offset="1" stop-color="#f3c1cc" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7ddc8" />
      <stop offset="0.55" stop-color="#d6cbf4" />
      <stop offset="1" stop-color="#f3c1cc" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#c9bcf2" stop-opacity="0.8" />
      <stop offset="0.6" stop-color="#f3c1cc" stop-opacity="0.25" />
      <stop offset="1" stop-color="#f3c1cc" stop-opacity="0" />
    </radialGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a4a35" flood-opacity="0.13" />
    </filter>
    <style>
      .serif { font-family: "Lora", Georgia, serif; fill: #4b3f2f; }
      .display { font-family: "Fraunces", Georgia, serif; fill: #4b3f2f; }
      .sans { font-family: "Karla", "Helvetica Neue", Arial, sans-serif; fill: #4b3f2f; }
      .label { font-family: "Karla", Arial, sans-serif; fill: #a79579; font-size: 12px;
               letter-spacing: 2.4px; text-transform: uppercase; }
      .hand { font-family: "Caveat", "Segoe Script", cursive; fill: #7c6c57; }
      .faint { fill: #a79579; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f7f1e7" />
  <g filter="url(#wash)" opacity="0.9">
    <ellipse cx="90" cy="30" rx="260" ry="160" fill="#d6cbf4" opacity="0.7" />
    <ellipse cx="1120" cy="80" rx="240" ry="150" fill="#b7ddc8" opacity="0.65" />
    <ellipse cx="620" cy="900" rx="460" ry="190" fill="#f3c1cc" opacity="0.55" />
  </g>
  <g opacity="0.5">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7a6850" opacity="0.22" />
    </pattern>
    <rect width="1200" height="900" fill="url(#dots)" />
  </g>

  <!-- masthead -->
  <g>
    <rect x="60" y="46" width="316" height="34" rx="17" fill="#fffdf8" stroke="#ecdfca" />
    <circle cx="82" cy="63" r="5" fill="#7cb79b" />
    <text x="96" y="68" class="label">AI Storyteller</text>
    <text x="246" y="68" class="label" style="letter-spacing:0;text-transform:none">v0.2.0</text>
    <text x="60" y="140" class="display" font-size="46" font-weight="500">
      Stories that <tspan fill="#a795e0" font-style="italic">speak</tspan> for themselves
    </text>
    <text x="60" y="172" class="serif" font-size="16" fill="#7c6c57">
      Write a topic, watch the story arrive word by word, then let it read itself back to you.
    </text>
    <text x="60" y="202" class="label" style="font-size:11px">streamed prose ✽ a small voice ✽ karaoke ✽ a shelf you keep</text>
  </g>

  <!-- composer -->
  <g filter="url(#card)">
    <rect x="60" y="238" width="368" height="330" rx="18" fill="#fffdf8" stroke="#ecdfca" />
  </g>
  <text x="88" y="276" class="label">what should happen?</text>
  <rect x="88" y="290" width="312" height="104" rx="12" fill="#fdf8f0" stroke="#ecdfca" />
  <text x="106" y="322" class="serif" font-size="15" fill="#a79579" font-style="italic">
    a lighthouse keeper who receives
  </text>
  <text x="106" y="346" class="serif" font-size="15" fill="#a79579" font-style="italic">
    letters from a ship that sank
  </text>
  <text x="106" y="370" class="serif" font-size="15" fill="#a79579" font-style="italic">
    in 1912
  </text>

  <rect x="88" y="412" width="196" height="46" rx="23" fill="url(#action)" />
  <text x="118" y="441" class="sans" font-size="14" font-weight="600">write the story</text>
  <rect x="296" y="412" width="104" height="46" rx="23" fill="#fffdf8" stroke="#ddc9ac" />
  <text x="318" y="441" class="sans" font-size="13" fill="#7c6c57">surprise me</text>

  <line x1="88" y1="488" x2="400" y2="488" stroke="#ecdfca" stroke-dasharray="4 5" />
  <text x="88" y="516" class="sans" font-size="12" fill="#a79579">more settings</text>
  <text x="88" y="546" class="sans" font-size="12" fill="#7c6c57">genre · mood · voice · length</text>
  <circle cx="94" cy="576" r="5" fill="#7cb79b" />
  <text x="108" y="581" class="sans" font-size="12" fill="#7c6c57">warming up the pen…</text>

  <!-- stage -->
  <g filter="url(#card)">
    <rect x="458" y="238" width="682" height="330" rx="18" fill="#fffdf8" stroke="#ecdfca" />
  </g>
  <g class="sans" font-size="11">
    <rect x="482" y="262" width="104" height="26" rx="13" fill="#e6f3ec" stroke="#b7ddc8" />
    <text x="498" y="279" fill="#5f9880">187 words</text>
    <rect x="594" y="262" width="112" height="26" rx="13" fill="#ede8fb" stroke="#d6cbf4" />
    <text x="610" y="279" fill="#8674c4">1:14 to read</text>
    <rect x="714" y="262" width="74" height="26" rx="13" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="732" y="279" fill="#7c6c57">Noir</text>
    <rect x="796" y="262" width="122" height="26" rx="13" fill="#fdeef2" stroke="#f3c1cc" />
    <text x="812" y="279" fill="#c07d90">Aurora · US</text>
    <rect x="926" y="262" width="96" height="26" rx="13" fill="#fdf6e2" stroke="#f8e6b2" />
    <text x="944" y="279" fill="#b9983f">archived</text>
  </g>

  <rect x="482" y="304" width="634" height="240" rx="12" fill="#fdf8f0" stroke="#ecdfca" />
  <line x1="515" y1="304" x2="515" y2="544" stroke="#d98ea2" stroke-opacity="0.35" />
  <circle cx="724" cy="406" r="76" fill="url(#halo)" />
  <text x="530" y="346" class="serif" font-size="17">
    The lighthouse keeper had letters again. They arrived
  </text>
  <text x="530" y="382" class="serif" font-size="17">
    with the tide, sealed in wax the colour of old blood,
  </text>
  <rect x="684" y="399" width="59" height="27" rx="6" fill="#f8e6b2" />
  <text x="530" y="419" class="serif" font-size="17">
    addressed in her <tspan x="688">own</tspan><tspan x="750"> hand, and the wax</tspan>
  </text>
  <text x="530" y="455" class="serif" font-size="17" fill="#a79579">
    was still warm. The first one asked her to keep the lamp
  </text>
  <text x="530" y="491" class="serif" font-size="17" fill="#a79579">
    lit on the sixteenth of March.
  </text>

  <!-- player -->
  <g filter="url(#card)">
    <rect x="458" y="586" width="682" height="152" rx="18" fill="#fffdf8" stroke="#ecdfca" />
  </g>
  <circle cx="524" cy="646" r="31" fill="url(#action)" />
  <path d="M518 633 l18 13 -18 13 z" fill="#4b3f2f" />
  <text x="576" y="626" class="label" style="font-size:11px">now speaking: “own”</text>
  <rect x="576" y="636" width="392" height="12" rx="6" fill="#fdf8f0" stroke="#ecdfca" />
  <rect x="576" y="636" width="164" height="12" rx="6" fill="url(#rail)" />
  <text x="982" y="647" class="sans" font-size="12" fill="#a79579">0:31 / 1:14</text>
  <line x1="482" y1="676" x2="1116" y2="676" stroke="#ecdfca" stroke-dasharray="4 5" />
  <g class="sans" font-size="12" fill="#7c6c57">
    <rect x="482" y="694" width="112" height="30" rx="15" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="498" y="713">↺ from the top</text>
    <rect x="604" y="694" width="120" height="30" rx="15" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="620" y="713">↓ save the mp3</text>
    <rect x="734" y="694" width="130" height="30" rx="15" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="750" y="713">⧉ copy the words</text>
    <rect x="874" y="694" width="128" height="30" rx="15" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="890" y="713">↗ share a link</text>
  </g>

  <!-- shelf -->
  <g filter="url(#card)">
    <rect x="60" y="586" width="368" height="262" rx="18" fill="#fffdf8" stroke="#ecdfca" />
  </g>
  <text x="88" y="622" class="label">your shelf</text>
  <g font-size="13">
    <rect x="88" y="640" width="312" height="58" rx="12" fill="#ede8fb" stroke="#d6cbf4" />
    <text x="104" y="663" class="sans" font-weight="600">⟡ The lighthouse keeper</text>
    <text x="104" y="683" class="sans" font-size="11" fill="#7c6c57">Noir · 187 words · 17 Sep</text>

    <rect x="88" y="708" width="312" height="58" rx="12" fill="#fdf8f0" stroke="#ecdfca" />
    <text x="104" y="731" class="sans" font-weight="600">⟡ The last video rental on the moon</text>
    <text x="104" y="751" class="sans" font-size="11" fill="#7c6c57">Science Fiction · 240 words · 16 Sep</text>
  </g>
  <rect x="88" y="780" width="156" height="42" rx="21" fill="#fffdf8" stroke="#ddc9ac" />
  <text x="110" y="806" class="sans" font-size="13" fill="#7c6c57">delete this story</text>
  <text x="264" y="806" class="hand" font-size="19">pick one to hear it again</text>
</svg>
