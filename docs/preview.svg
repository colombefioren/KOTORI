<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
     role="img" aria-labelledby="title desc">
  <title id="title">KOTORI — a pastel paper studio that writes a story and reads it aloud</title>
  <desc id="desc">A scrapbook interface: three index tabs, a brief card with a genre field, a
    reader with a round play button, and the story written on a torn sheet of ruled paper with the
    spoken words highlighted in pastel blue.</desc>

  <defs>
    <linearGradient id="wash-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9d5e4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f9d5e4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wash-blue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e7fa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d8e7fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sticker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d5e4"/>
      <stop offset="1" stop-color="#f2b3cd"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e7fa"/>
      <stop offset="1" stop-color="#b3d0f2"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8e7fa"/>
      <stop offset="1" stop-color="#f9d5e4"/>
    </linearGradient>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#443b48" flood-opacity="0.16"/>
    </filter>
    <clipPath id="torn">
      <path d="M0 0h1188v196l-25 12-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-24 13-25-14-24 12-25-13-24 14-25-12-25 13V0Z"/>
    </clipPath>
    <style>
      .display { font-family: "Fraunces", "Iowan Old Style", Georgia, serif; }
      .serif { font-family: "EB Garamond", Garamond, Georgia, serif; }
      .ui { font-family: "Karla", "Helvetica Neue", Arial, sans-serif; }
      .hand { font-family: "Kalam", "Bradley Hand", cursive; }
      .type { font-family: "Special Elite", "Courier New", monospace; }
      .label { font-family: "Special Elite", "Courier New", monospace; font-size: 11px;
               letter-spacing: 2.6px; fill: #9d94a2; }
      .body { font-family: "EB Garamond", Garamond, Georgia, serif; font-size: 19px; fill: #443b48; }
      .faint { fill: #9d94a2; }
      .chip { font-family: "Special Elite", "Courier New", monospace; font-size: 10px;
              letter-spacing: 1.2px; fill: #5b83b6; }
    </style>
  </defs>

  <!-- the desk -->
  <rect width="1200" height="800" fill="#f2e8ee"/>
  <rect width="1200" height="800" fill="url(#wash-pink)"/>
  <rect width="1200" height="800" fill="url(#wash-blue)"/>

  <!-- masthead -->
  <text class="display" x="52" y="96" font-size="68" font-weight="600" fill="#443b48"
        letter-spacing="-2">KOTO<tspan fill="#bd5f8b" font-style="italic">RI</tspan></text>
  <text class="hand" x="54" y="126" font-size="23" fill="#6f6573">a little bird that tells you stories</text>

  <!-- the shelf note -->
  <g transform="rotate(-1.2 1050 96)">
    <rect x="928" y="62" width="216" height="62" rx="9" fill="#fdf9f0" stroke="#e8dbe2" stroke-width="1.5"/>
    <text class="label" x="948" y="86">3 STORIES KEPT · 1200 WORDS</text>
    <text class="label" x="948" y="106">A QUIET WRITER</text>
  </g>
  <g transform="rotate(-1.4 1010 44)">
    <rect x="938" y="26" width="146" height="30" rx="15" fill="#fffdfa" stroke="#cdbac5" stroke-width="1.5"/>
    <circle cx="958" cy="41" r="7.5" fill="url(#rail)" stroke="#cdbac5" stroke-width="1"/>
    <text class="label" x="974" y="45">NIGHT DESK</text>
  </g>

  <!-- index tabs -->
  <g>
    <rect x="52" y="158" width="24" height="40" rx="6" fill="#f9d5e4" stroke="#cdbac5" stroke-width="1.5"/>
    <path d="M86 198v-32a9 11 0 0 1 9-11h108a9 11 0 0 1 9 11v32z" fill="#fdf7f8" stroke="#e8dbe2" stroke-width="1.5"/>
    <text class="type" x="102" y="172" font-size="10" fill="#9d94a2">01</text>
    <text class="hand" x="122" y="186" font-size="21" fill="#6f6573">home</text>

    <path d="M226 198v-32a9 11 0 0 1 9-11h172a9 11 0 0 1 9 11v32z" fill="#fffdfa" stroke="#cdbac5" stroke-width="1.5"/>
    <rect x="272" y="150" width="46" height="14" rx="3" fill="#d8e7fa" opacity="0.85"
          transform="rotate(-3 295 157)"/>
    <text class="type" x="242" y="172" font-size="10" fill="#9d94a2">02</text>
    <text class="hand" x="262" y="187" font-size="21" fill="#443b48">playground</text>

    <path d="M430 198v-32a9 11 0 0 1 9-11h156a9 11 0 0 1 9 11v32z" fill="#fdf7f8" stroke="#e8dbe2" stroke-width="1.5"/>
    <text class="type" x="446" y="172" font-size="10" fill="#9d94a2">03</text>
    <text class="hand" x="466" y="187" font-size="21" fill="#6f6573">history</text>
    <rect x="580" y="166" width="22" height="20" rx="10" fill="#f9d5e4" stroke="#e288ae" stroke-width="1.4"/>
    <text class="type" x="586" y="181" font-size="10" fill="#443b48">3</text>
    <line x1="52" y1="199" x2="1148" y2="199" stroke="#cdbac5" stroke-width="1.5" stroke-dasharray="8 8"/>
  </g>

  <!-- the brief card -->
  <g filter="url(#paper)">
    <rect x="52" y="228" width="430" height="196" rx="10" fill="#fffdfa" stroke="#e8dbe2" stroke-width="1.5"/>
  </g>
  <rect x="38" y="216" width="110" height="26" fill="#f9d5e4" opacity="0.9"
        transform="rotate(-8 93 229)"/>
  <text class="label" x="76" y="262">THE BRIEF · ONE LINE IS ENOUGH</text>
  <text class="hand" x="76" y="292" font-size="19" fill="#6f6573">what should happen?</text>
  <g>
    <rect x="76" y="304" width="382" height="74" rx="8" fill="#fdf7f8" stroke="#cdbac5" stroke-width="1.5"/>
    <line x1="76" y1="330" x2="458" y2="330" stroke="#e8dbe2"/>
    <line x1="76" y1="359" x2="458" y2="359" stroke="#e8dbe2"/>
    <text class="serif" x="90" y="327" font-size="17" fill="#443b48">a lighthouse keeper who receives letters</text>
    <text class="serif" x="90" y="356" font-size="17" fill="#443b48">from a ship that sank in 1912</text>
  </g>
  <rect x="76" y="390" width="182" height="26" rx="8" fill="#fdf7f8" stroke="#cdbac5" stroke-width="1.5"/>
  <text class="type" x="88" y="407" font-size="10" fill="#9d94a2">GENRE · GHOST STORY</text>
  <text class="hand" x="286" y="410" font-size="17" fill="#bd5f8b">← paste your own</text>

  <!-- the reader card -->
  <g filter="url(#paper)">
    <rect x="512" y="228" width="634" height="196" rx="10" fill="#fffdfa" stroke="#e8dbe2" stroke-width="1.5"/>
  </g>
  <rect x="500" y="216" width="96" height="24" fill="#d8e7fa" opacity="0.9"
        transform="rotate(-4 548 228)"/>
  <text class="label" x="536" y="262">THE READER · PRESS PLAY AND READ ALONG</text>
  <circle cx="586" cy="330" r="38" fill="url(#play)" stroke="#5b83b6" stroke-width="2"/>
  <circle cx="586" cy="330" r="34" fill="none" stroke="#fffdfa" stroke-width="2"/>
  <path d="M576 314l26 16-26 16z" fill="#443b48"/>
  <text class="label" x="654" y="308">NOW SPEAKING · “HARBOUR”</text>
  <rect x="654" y="320" width="464" height="15" rx="8" fill="#f7eef2" stroke="#cdbac5" stroke-width="1.5"/>
  <rect x="654" y="320" width="228" height="15" rx="8" fill="url(#rail)"/>
  <text class="type" x="654" y="360" font-size="10" fill="#9d94a2">1:42 / 3:12</text>
  <text class="hand" x="654" y="392" font-size="18" fill="#9d94a2">space plays and pauses · ← → skip five seconds</text>
  <line x1="536" y1="404" x2="1122" y2="404" stroke="#e8dbe2" stroke-dasharray="6 6"/>
  <text class="ui" x="536" y="422" font-size="12" fill="#6f6573">↺ from the top</text>
  <text class="ui" x="654" y="422" font-size="12" fill="#6f6573">↓ save the mp3</text>
  <text class="ui" x="772" y="422" font-size="12" fill="#6f6573">⧉ copy the words</text>
  <text class="ui" x="900" y="422" font-size="12" fill="#6f6573">↗ share a link</text>

  <!-- the story sheet, torn out of a notebook -->
  <g filter="url(#paper)">
    <rect x="52" y="456" width="1094" height="248" fill="#fffdfa"/>
  </g>
  <g clip-path="url(#torn)">
    <rect x="52" y="640" width="1094" height="70" fill="#fffdfa"/>
  </g>
  <rect x="52" y="456" width="1094" height="248" fill="none" stroke="#cdbac5" stroke-width="1.5"/>
  <line x1="112" y1="472" x2="112" y2="684" stroke="#f2b3cd" stroke-width="1.5"/>
  <g fill="#f2e8ee" stroke="#e8dbe2" stroke-width="1.5">
    <circle cx="82" cy="502" r="7.5"/><circle cx="82" cy="566" r="7.5"/><circle cx="82" cy="630" r="7.5"/>
  </g>
  <text class="label" x="140" y="486">THE PAGE · WRITTEN HERE, HEARD HERE</text>

  <g class="body">
    <text x="140" y="524">The <tspan font-weight="600">keeper</tspan> counted the sails twice before she believed them. Every</text>
    <text x="140" y="553">letter that arrived that winter smelled of salt and engine oil, and none of</text>
    <text x="140" y="582">them had been written by anyone still living. She kept them in a biscuit</text>
    <text x="140" y="611">tin, then in the lamp room, where <tspan class="faint">the light could read</tspan></text>
    <text x="140" y="640"><tspan class="faint">them back to the sea</tspan> night after night after night.</text>
  </g>

  <!-- the spoken word, on a pastel highlighter mark, with the halo behind it -->
  <circle cx="330" cy="578" r="46" fill="#d8e7fa" opacity="0.55"/>
  <rect x="286" y="562" width="92" height="26" rx="4" fill="#d8e7fa"/>
  <text class="serif" x="290" y="582" font-size="19" fill="#443b48">biscuit</text>
  <path d="M382 592v22" stroke="#bd5f8b" stroke-width="2"/>

  <!-- margin notes -->
  <text class="hand" x="960" y="700" font-size="20" fill="#9d94a2">every story is four hundred words</text>
  <path d="M930 676c26-14 52-16 78-6" fill="none" stroke="#5b83b6" stroke-width="2" stroke-linecap="round"/>
  <path d="M930 676l14-3M930 676l9 11" fill="none" stroke="#5b83b6" stroke-width="2" stroke-linecap="round"/>
</svg>
