[project]
name = "kotori"
version = "0.4.0"
description = "KOTORI — a pastel paper studio that writes a story and reads it back to you."
readme = "README.md"
authors = [
    { name = "colombefioren", email = "colomberakotonjanahary@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["gradio", "langchain", "storytelling", "tts", "generative-ai"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Artistic Software",
]
dependencies = [
    "gradio>=6.27.0",
    "gtts>=2.5.4",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
kotori = "kotori:main"

[project.urls]
Homepage = "https://github.com/colombefioren/kotori"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# typographic apostrophes and dashes are deliberate in the prose handling
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# gradio layouts are nested contexts by design: merging `with` blocks hurts
"src/kotori/ui.py" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# keep addopts lean so a single test file can be run on its own;
# CI adds the coverage flags and the floor.
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/kotori"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
